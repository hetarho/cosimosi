syntax = "proto3";

package cosimosi.store.v1;

// StoreService owns the decoration catalog's read contract: what may be worn, what the caller owns,
// and what the universe wears right now.
//
// Structural defense, and the reason this file is shaped the way it is:
//
//   * There is NO ListInventory message and NO Equip method. Ownership is a bool beside a price on
//     a catalog row, so the client has one list of everything and reveals ownership through price
//     alone ([P6][P7]) — a locker and an equip step are not merely discouraged, they are unsayable.
//   * An Ornament carries an id, a kind, an acquisition path and a price. It carries no label,
//     blurb, asset URL, color, size, brightness or seed, so the wire cannot describe what an
//     ornament LOOKS like — only name one ([V10][I11]). The looks live in the renderer's registries;
//     the server never learns them.
//   * No message names a user. Scope comes from the authenticated caller.
service StoreService {
  // Read the whole catalog — owned and unowned alike — with the caller's ownership, current
  // selection and the server-resolved price on each row.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Read what the universe wears right now: exactly one entry per kind, defaults included.
  rpc GetSelection(GetSelectionRequest) returns (GetSelectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// The surfaces decoration opens. Closed at two — a sky, and the body shape a memory is shown as.
// They are the staging
// layer, and nothing meaning-bearing — a position, a strength, an emotion, a forgetting stage — is
// expressible as a kind at all.
enum OrnamentKind {
  ORNAMENT_KIND_UNSPECIFIED = 0;
  ORNAMENT_KIND_BACKGROUND = 1;
  ORNAMENT_KIND_STAR_SHADER = 2;
}

// How a row is come by. FREE is owned by everyone with no ownership row anywhere; ACHIEVEMENT is
// unbuyable at any price ([P11]).
enum OrnamentAcquisition {
  ORNAMENT_ACQUISITION_UNSPECIFIED = 0;
  ORNAMENT_ACQUISITION_FREE = 1;
  ORNAMENT_ACQUISITION_PURCHASE = 2;
  ORNAMENT_ACQUISITION_ACHIEVEMENT = 3;
}

message GetCatalogRequest {}

message Ornament {
  string ornament_id = 1;
  OrnamentKind kind = 2;
  OrnamentAcquisition acquisition = 3;
  // Resolved server-side from the kind. Zero for every FREE and ACHIEVEMENT row, so the client
  // never holds a price table.
  int64 price = 4;
  bool owned = 5;
  bool selected = 6;
}

message GetCatalogResponse {
  repeated Ornament ornaments = 1;
}

message GetSelectionRequest {}

message OrnamentSelection {
  OrnamentKind kind = 1;
  string ornament_id = 2;
}

message GetSelectionResponse {
  repeated OrnamentSelection selections = 1;
}
