syntax = "proto3";

package cosimosi.account.v1;

// AccountService owns the authenticated user's profile, provider-linkage, invite-link, and
// presentation-preference contract.
//
// Structural defense: no request can name a user id, and the writable profile surface is exactly
// nickname, timezone, and locale. No mood, coordinate, memory id, position, or strength can cross
// this boundary.
service AccountService {
  // Perform the caller's once-per-account first write. The opaque invite token can only arrive
  // from link capture; signup binds it but never pays a reward.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  // Read the caller's profile. An absent profile message means the account is not provisioned.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replace the caller's complete editable profile surface.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Read the caller's currently linked authentication methods.
  rpc ListAuthProviders(ListAuthProvidersRequest) returns (ListAuthProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Derive a fresh signed invite capability without storing it.
  rpc GetInviteLink(GetInviteLinkRequest) returns (GetInviteLinkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Read the caller's stored palette id (the default id when unset). Side-effect-free unary read:
  // NO_SIDE_EFFECTS opts Connect clients into HTTP GET (never shared-CDN-cached; user-scoped).
  rpc GetPalettePreference(GetPalettePreferenceRequest) returns (PalettePreference) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Store the caller's palette id. Accepts only an id known to the first-party registry; an
  // unknown id is rejected. Mutates the stored preference — NOT NO_SIDE_EFFECTS.
  rpc SetPalettePreference(SetPalettePreferenceRequest) returns (PalettePreference);
  // Account-scoped soft deletion; restorable for account.withdrawal_retention_days.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  // Undo withdrawal inside the retention window. This is the one procedure a withdrawn scope
  // may call.
  rpc RestoreAccount(RestoreAccountRequest) returns (RestoreAccountResponse);
}

message SignUpRequest {
  string nickname = 1;
  string timezone = 2;
  string locale = 3;
  string invite_token = 4;
}

message SignUpResponse {
  string nickname = 1;
  string timezone = 2;
  string locale = 3;
  bool invite_bound = 4;
}

message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
}

message Profile {
  string nickname = 1;
  string timezone = 2;
  string locale = 3;
  string email = 4;
  string created_at = 5;
}

message UpdateProfileRequest {
  string nickname = 1;
  string timezone = 2;
  string locale = 3;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message ListAuthProvidersRequest {}

message ListAuthProvidersResponse {
  repeated LinkedAuthProvider providers = 1;
}

message LinkedAuthProvider {
  AuthProviderKind kind = 1;
  string linked_at = 2;
}

enum AuthProviderKind {
  AUTH_PROVIDER_KIND_UNSPECIFIED = 0;
  AUTH_PROVIDER_KIND_GOOGLE = 1;
  AUTH_PROVIDER_KIND_PASSWORD = 2;
}

message GetInviteLinkRequest {}

message GetInviteLinkResponse {
  string token = 1;
  string expires_at = 2;
}

// Caller = the authenticated user (scope from the auth context); no request fields.
message GetPalettePreferenceRequest {}

// palette_id is the entire writable surface.
message SetPalettePreferenceRequest {
  string palette_id = 1;
}

// The resolved palette id (the default id when the user never set one).
message PalettePreference {
  string palette_id = 1;
}

// Scope comes only from the authenticated context. There is deliberately no user_id,
// purge_now, skip_window, immediate-delete, reason, or exit-survey field, and there is no
// PurgeAccount RPC. A client cannot bypass the retention window.
message WithdrawRequest {}

message WithdrawResponse {
  string withdrawn_at = 1;
  string restore_deadline_at = 2;
}

message RestoreAccountRequest {}

message RestoreAccountResponse {
  string restored_at = 1;
}
