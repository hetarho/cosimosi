# Build-time tuning constants generated by `pnpm gen:values`.
# Groups and keys use snake_case; generated consumers expose camelCase TS keys
# and PascalCase Go constants.
#
# Put product-shaping constants here: thresholds, caps, coefficients, defaults,
# debounce/delay windows, numeric arrays, and explicit scalar lookup tables.
#
# Keep these out of values.yaml: runtime env, secrets, URLs, DSNs, API keys,
# feature flags, proto contracts, SQL schemas, formulas, UI copy, theme CSS, and
# arrays whose length can be derived from their content.
client_cache:
  # TanStack Query defaults shared by web and mobile cache providers.
  default_stale_ms: 30000
  default_gc_ms: 300000
  default_retry_count: 1

errors:
  # Keep transient error feedback visible long enough to read without requiring manual dismissal.
  toast_auto_dismiss_ms: 6000

auth_session:
  # Refresh before expiry so transport calls do not fall through to anonymous RPCs.
  access_token_refresh_skew_ms: 60000

supabase_auth:
  # Cache Supabase JWKS long enough to avoid per-request key fetches.
  jwks_cache_ttl_ms: 600000
  # Rate-limit forced JWKS refreshes after key misses.
  jwks_miss_refresh_interval_ms: 60000

account:
  # Profile nicknames are trimmed and measured in Unicode code points, not bytes.
  nickname_min_length: 2
  # Fits the /me field and future compact list rows without truncation.
  nickname_max_length: 24
  # Stateless invite capabilities expire this many days after their signed issued-at.
  invite_link_ttl_days: 7
  # A withdrawn account remains restorable for this many real-clock UTC days before its
  # user-owned sweep may hard-delete it. Independent from diary-release retention.
  withdrawal_retention_days: 30
  # Withdrawal admission rechecks the authoritative account status after this short window.
  withdrawal_status_cache_ttl_ms: 5000
  # Process-local withdrawal-status entries retained before least-recently-used eviction.
  withdrawal_status_cache_max_entries: 4096

rendering:
  # Active universe ambiance skin (preset key in @cosimosi/3d-renderer UNIVERSE_SKINS).
  # The retired flat presets are gone; `emotion` is the shared web/mobile sky-sphere skin.
  active_skin: emotion
  # (Which gist body, which mote and which mote field the universe wears are NOT values: they are
  # per-user ornament selections, and each kind's undecorated look is its own registry's DEFAULT_*
  # constant — the same place DEFAULT_SKY_EFFECT and DEFAULT_STAR_SHAPE already live.)
  # Cap devicePixelRatio so high-DPI screens don't tank the GPU frame budget. It is the CEILING the
  # adaptive sampler below steps up to, never the ratio a struggling device is held at.
  max_pixel_ratio: 2
  # Adaptive quality. The scene animates continuously (the ambient sky and twinkle are the product),
  # so `frameloop="demand"` is not available as a lever and pixel ratio is: shading cost scales with
  # its square, and a phone that cannot hold the frame budget at 2 usually can at 1. A sampler
  # averages fps over a window and steps the ratio one notch per closed window.
  #
  # The window is long enough that a single stutter (a shader compile, a GC pause) cannot move the
  # ratio, and short enough that a device entering a heavy scene recovers within about a second.
  adaptive_dpr_window_seconds: 1.5
  # Below down_fps a window steps down, above up_fps it steps up, and in between nothing moves.
  # up_fps sits near the 60 Hz ceiling so the ratio climbs only when there is genuine headroom.
  adaptive_dpr_down_fps: 45
  adaptive_dpr_up_fps: 57
  # One step's change in pixel ratio. Small enough that a step is not visible as a resolution jump,
  # large enough that the walk from the cap to the floor takes a few windows, not a minute.
  adaptive_dpr_step: 0.25
  # Direction reversals the walk may make before it settles and stops adapting for the rest of the
  # scene's life. The dead band alone does NOT prevent oscillation, because dropping the ratio is
  # what raises the frame rate: a device sitting at 44 fps at ratio 2 reaches 58 at 1.75, which is
  # above up_fps, so it climbs back to 2 and falls to 44 again — a visible resize every window,
  # forever. Nothing measurable distinguishes that device from one with real headroom, because
  # vsync caps both at 60. So the walk instead LEARNS: after this many reversals it settles, always
  # on the lower of the two ratios (never leave a device at one it could not hold). 2 allows one
  # recover-and-retry — a genuine transient gets a second chance — and costs at most two extra
  # resizes before the picture is stable for good.
  adaptive_dpr_max_flipflops: 2
  # World-unit motion below which a candidate coordinate buffer is NOT published to the renderer, so
  # the instanced layers can skip recomposing matrices for a converged universe. Sub-pixel at the
  # closest framing the camera allows: at UNIVERSE_CAMERA_RIG's min distance (8) and fov 55, one
  # screen pixel spans ~0.008 world units on a 1000px-tall viewport, so 0.002 is a quarter of the
  # nearest pixel and the drift it withholds cannot be seen. Compared against the last PRESENTED
  # buffer, never the last candidate, so drift that stays under it still publishes once it adds up.
  coordinate_publication_epsilon: 0.002
  # The curve that lands accumulated light on the display (key in @cosimosi/3d-renderer
  # tone-mapping.ts). Every layer here ADDS light — the sky, the colour field, the bodies, the bloom
  # pass — so a dense region sums past 1 in every channel, and with no curve the framebuffer clips
  # each channel in turn until the pixel is white whatever colour arrived there. `neutral` is chosen
  # over the filmic curves because it leaves mid-tones alone and compresses only above ~0.8: the
  # night between the stars stays dark, while a core that would have clipped is pulled back to its
  # own hue. See that module for why reinhard/aces/agx were rejected.
  tone_mapping: neutral
  # Exposure multiplier applied before the curve. 1.0 = the scene's own light, unscaled; the
  # per-layer amplitudes (emotion_sky_exposure, nebula.base_intensity) are the intended place to
  # trim brightness, so this stays neutral unless the whole frame needs a global shift.
  tone_mapping_exposure: 1.0
  # Overall exposure of the emotion palette before a sky effect shapes it. Kept below 1 because
  # the enclosing sky covers the whole frame and the scene bloom pass amplifies bright regions.
  emotion_sky_exposure: 0.62
  # Per-effect alpha of the enclosing emotion sky. Full-frame fills stay more transparent while
  # sparse line/ray effects retain enough presence; every effect leaves the black void and stars
  # visible even when one emotion fills the palette ramp.
  emotion_sky_opacity:
    grainient: 0.74
    # Denser than Grainient: the grain needs a solid surface under it or it reads as static.
    grainstorm: 0.82
    iridescence: 0.76
    soft_aurora: 0.86
    liquid_ether: 0.74
    prismatic_burst: 0.9
    plasma_wave: 0.92
    ferrofluid: 0.92
    floating_lines: 0.88
    evil_eye: 0.92
    lightfall: 0.92
    pixel_blast: 0.94
  # Per-recipe luminance ceiling the sky holds itself under, leaving the rest of the range for the
  # light ADDED on top of it — stars, the nebula colour field, and the bloom pass. Addition over an
  # already-bright surface passes 1 in every channel at once, which is white: that is what made a star
  # seen against a wide lit backdrop lose its colour and its neighbourhood with it. So the wider and
  # brighter a recipe fills the frame, the lower its ceiling. Sparse mark recipes (lines, dots) barely
  # need one; full-frame curtains and fluids need the most.
  emotion_sky_headroom:
    grainient: 0.72
    # Lower than Grainient's: heavy grain adds its own high-frequency luminance on top of the colour,
    # so the colour has to start further below the ceiling for the sum to stay off white.
    grainstorm: 0.66
    iridescence: 0.7
    soft_aurora: 0.58
    liquid_ether: 0.7
    prismatic_burst: 0.8
    plasma_wave: 0.82
    ferrofluid: 0.68
    floating_lines: 0.84
    evil_eye: 0.8
    lightfall: 0.84
    pixel_blast: 0.88
  # Star (episodic-memory) instance scale range — world radius mapped from EffectiveStrength
  # (base_strength + recall accumulation). Bigger memory → bigger star [V3].
  star_size_min: 0.7
  star_size_max: 2.4
  # Star brightness range mapped from EffectiveBrightness [V2]. Epic A resolves full (max);
  # min is the decay floor Epic D dims toward — a star is dimmed, never deleted.
  star_brightness_min: 0.15
  star_brightness_max: 1.0
  # Filament (synapse) fat-line half-width range in world units, mapped from
  # EffectiveSynapseStrength — a stronger synapse draws a thicker line [V6].
  filament_width_min: 0.04
  filament_width_max: 0.35
  # Filament glow range mapped from EffectiveSynapseStrength — stronger synapse glows brighter [V6].
  filament_brightness_min: 0.12
  filament_brightness_max: 0.85
  # Cell-star (neuron) constant point radius in world units — seedless, no emotion color; a
  # neuron carries information, not emotion [V5]. Degree-driven sizing stays reserved.
  cell_star_point_size: 0.26
  # Star-shape triangle ceiling — every entry in the star-shape catalogue must build a body under
  # this, and a test over the registry fails a new shape that does not. It is the LARGEST body the
  # scene may pay per memory instance, so a decorated universe of N stars costs at most N × this.
  # 5120 is an icosphere at subdivision 4: the coarsest shell that still resolves a silhouette
  # CARVED by vertex displacement (the urchin's needles). Anything beyond it is raw subdivision
  # buying detail the fragment/normal path already gives for free — see tech/rendering.md.
  star_shape_triangle_budget: 5120
  # Star backdrop: the small floating background stars every emotion sky wears — decorative,
  # rendering-only, no DB. Web = open-beta density; mobile MVP lowers the instance count (§3.5),
  # mirroring latent_star_count[_mobile].
  star_field_count: 2600
  star_field_count_mobile: 1000
  # Outer shell the field fills out to. Fixed by the backdrop NESTING invariant, not by fidelity:
  # camera zoom-out limit < this < sky-sphere radius < canvas far plane (tech/rendering.md). Mobile
  # matches web because both platforms share that camera envelope; the key is still per-platform so
  # a mobile-only camera change has somewhere to land instead of silently breaking the ordering.
  star_field_radius: 520
  star_field_radius_mobile: 520
  # Icosahedron subdivisions per backdrop mote. 0 = 20 triangles, and each step up multiplies by 4.
  # A mote covers a handful of pixels at most, so its silhouette is the only thing tessellation buys
  # and an icosahedron already spends every triangle on it — a UV sphere of the same count crowds
  # most of them at the poles, where nothing is seen. No mobile variant: this is already the floor.
  star_field_mote_detail: 0
  # Latent-star field ([E7a][V7]): gray not-yet-recruited engram points scattered through the
  # hippocampus z-band (force_sim.hippocampus_z_*), filling the visible volume. Rendering-only,
  # no DB. Web = open-beta density; mobile MVP lowers the instance count (§3.5).
  latent_star_count: 1800
  latent_star_count_mobile: 700
  # Sphere segments per latent mote (both width and height) — the field's other fixed vertex cost.
  # Web keeps the tessellation the look was tuned at; mobile MVP takes the coarser shell, which at
  # this on-screen size costs the dust nothing it can be seen to lose.
  latent_star_segments: 6
  latent_star_segments_mobile: 4
  # World radius of the x,y disc the field scatters within (z comes from the hippocampus band).
  latent_field_radius: 56
  # Latent point world radius — small and dim; below cell_star_point_size so a real neuron reads
  # as brighter/larger than the silent field it wakes from.
  latent_star_size: 0.12
  # Awaken flare pool ceiling: max concurrent birth flares rendered at once. A launch rarely births
  # more than a few new neurons; an overflowing burst is not lost — the excess flares on the next
  # pass.
  awaken_capacity: 32
  # Awaken-flare choreography. The fixed-capacity pool advances through a 0→1 life over this many
  # seconds, peaks at this rendered scale, and clamps a resumed/backgrounded frame to this step so
  # one large delta cannot skip the birth entirely. The sin-envelope shape stays rendering code.
  awaken_duration_s: 1.1
  awaken_peak_size: 0.9
  awaken_max_step_s: 0.05
  # Diary→universe spotlight choreography. The hold has its own clock because camera arrival can
  # force-complete while a star settles; dim and lift are pre-tone-map exposure/brightness factors,
  # and lambda is the per-frame exponential easing rate used in both directions.
  spotlight_hold_s: 4.5
  spotlight_fade_lambda: 3.4
  spotlight_scene_dim: 0.22
  spotlight_star_lift: 4
  # Gist-star (neocortical body, [V3][V5][V9]) instance scale range mapped from EffectiveStrength —
  # kept below the episodic star_size_* so a gist reads as a quieter echo of its memory.
  gist_star_size_min: 0.55
  gist_star_size_max: 1.8
  # Base softness of the diffuse gist body (0..1) — the [V5] "gistified" look distinguishing it
  # from the sharp episodic seed body; deeper stages read progressively more diffuse from here.
  gist_star_diffuse: 0.55
  # Depth-cue haze intensity across the hippocampus↔neocortex gap (z 18–27, [V9]) — a restrained
  # rendering affordance marking the layer boundary, never a wall.
  gist_rise_layer_fog: 0.35

ui:
  # Responsive sheet geometry. Tailwind's `md` utility is 48rem; script consumers derive their
  # media query and 768px comparison from this one rem value, while a chain test pins the remaining
  # CSS/Tailwind anchors to it. 1rem = 16 CSS px for media-query breakpoint conversion.
  sheet_breakpoint_rem: 48
  # A modal-shaped bottom sheet dismisses after this much downward travel. The scrim-less resizable
  # sheet has a separate, shorter overshoot threshold because its travel begins only after it has
  # already reached its minimum height.
  sheet_dialog_dismiss_px: 96
  sheet_resize_dismiss_px: 72
  # Shared release classification for both sheet gestures. Velocity is CSS pixels per millisecond;
  # the distance floor prevents the first few pixels of an ordinary press from reading as a flick.
  sheet_flick_px: 24
  sheet_flick_velocity_px_per_ms: 0.5
  # Gesture settle, CSS leave animation, and presence-unmount hold all complete together.
  sheet_settle_ms: 200
  # Resizable-sheet height bounds as viewport-height ratios, plus the maximum movement that still
  # counts as the discrete tap alternative to dragging.
  sheet_tallest_viewport_ratio: 0.7
  sheet_shortest_viewport_ratio: 0.3
  sheet_tap_px: 6

nebula:
  # Emotion color field ([M4][M5]): each rendered memory bleeds its mood color into the ambient
  # field, weighted by EffectiveStrength (base + recall accumulation). Its own group — the unit
  # owns a coherent scalar set; folding into rendering.* would blur ownership. Contributions
  # composite additively behind the bodies, so the universe's global tone is emergent, never
  # stored. Realized as per-contributor soft-glow kernels in world space (see tech/rendering.md).
  #
  # EffectiveStrength → bleed radius (world units). Stronger stars bleed wider [M4].
  #
  # The binding constraint is the RATIO to the star's own body, not the absolute size: a body is
  # star_size_min..max (0.7..2.4) world radius, so a kernel of 18 put a 12.6-radius glow around a
  # 1.9-radius body — nearly 7× the radius, ~44× the area. The body became 2% of its own glow, and
  # since the bloom pass blurs that whole bright disc back across the body in the composite, the
  # star's surface (its seed relief and shimmer) was buried under an additive constant no tone curve
  # could recover. At 6 the glow runs ~2.5× the body radius: still unmistakably a bleed into the
  # space around the memory, but the memory is an object inside it rather than a speck.
  bleed_radius_coefficient: 6
  # Floor radius so even the weakest star reads as a tight local glow rather than vanishing [M4].
  # Held at the same ~2.5× against star_size_min so the ratio above holds across the whole range.
  min_bleed_radius: 2.0
  # Local-region density falloff sharpness — higher concentrates color near the star, so overlapping
  # regions still bleed but each keeps a dense core and the diffuse mid-field haze (which is what
  # sums toward white where stars cluster) stays thin.
  falloff_exponent: 4.5
  # Contributor budget cap — the strongest N memories bleed into the field (perf lever, shared
  # by web and mobile; the field stays legible when a universe grows past this).
  max_contributors: 96
  # Per-platform contributor kernel tessellation (silhouette smoothness of each glow). Mobile
  # lower — the MVP fidelity reduction from the same TSL source (§3.5).
  field_resolution_web: 24
  field_resolution_mobile: 10
  # Overall additive amplitude per kernel — the primary saturation lever. Held well below 1 so that
  # where many kernels overlap their sum reads as a coexisting blend rather than a blown-out white
  # core. It must also stay under the skin's bloom threshold: the field is meant to be bled colour,
  # not a bloom source, and once the haze crosses that threshold the pass blurs it back over the star
  # bodies and erases their surfaces. Raised alongside the bleed-radius cut above — a kernel of 6
  # covers roughly a ninth of the area an 18 did, so the same amplitude delivered far less field.
  base_intensity: 0.42

ai:
  # Voyage 4-family embeddings default to 1024 dimensions while still allowing smaller/larger Matryoshka outputs.
  embedding_dim: 1024
  # Generic max-output guard for one real LLM call; provider/model specifics stay runtime config.
  # Sits above encode.max_output_tokens — the encode split is the largest response the product
  # asks for (it carries the diary redistributed across the memories), so a call that outgrows
  # its own use-case guard is caught there first, with this as the backstop for every other call.
  per_call_token_cap: 7000
  # Real AI adapters meter billable calls per user on a UTC calendar-day window.
  daily_call_cap: 200
  # Maximum identical-input responses retained by each process-local real-adapter cache.
  adapter_cache_max_entries: 1024
  # Worker failures retry this many total attempts before the row is kept as failed.
  job_max_attempts: 5
  # Exponential worker retry base: base * 2^attempts, with no jitter for deterministic tests.
  job_backoff_base_ms: 60000
  # A claimed job's lease window: it only has to outlast one handler run. A worker that
  # dies mid-run frees its job for re-claim after this; the lease fence keeps the dead
  # worker from finalizing the row late. Its own knob, not coupled to the retry backoff.
  job_lease_ms: 300000
  # Hard loop-breaker: a job re-claimed this many times without ever completing (a handler
  # that keeps killing its worker) is dead-lettered. Set well above job_max_attempts so
  # ordinary transient retries never trip it.
  job_max_claims: 20
  # Queue-inspection metadata for done/failed/cancelled jobs is retained for this many
  # real-clock days, then removed in bounded batches by the worker loop. This governs
  # identity/revision-only job metadata, never Diary or memory source retention.
  job_terminal_retention_days: 30

worker:
  # Real-clock cadence for scanning terminal job metadata after the previous scan drains.
  cleanup_interval_s: 3600
  # Maximum terminal rows removed by one maintenance pass; a full pass drains one more batch
  # on the next claim, while product claims continue between batches.
  cleanup_batch_size: 100

emotion:
  # Mood coordinates are domain facts, stored on each memory at launch time.
  mood_valence:
    joy: 0.82
    calm: 0.62
    sad: -0.78
    anger: -0.76
    fear: -0.82
    love: 0.9
    neutral: 0
    excitement: 0.78
    gratitude: 0.76
    relief: 0.68
    stress: -0.7
    tired: -0.55
    emptiness: -0.68
  mood_arousal:
    joy: 0.72
    calm: 0.22
    sad: 0.28
    anger: 0.86
    fear: 0.88
    love: 0.66
    neutral: 0.5
    excitement: 0.9
    gratitude: 0.38
    relief: 0.3
    stress: 0.78
    tired: 0.18
    emptiness: 0.16
  # Arousal linearly seeds a memory's initial strength; later recall/decay rules build on it.
  arousal_strength_min: 0.35
  arousal_strength_max: 0.75
  default_intensity: 0.7

palette:
  # Axis-consistency tolerance [P3]: checkPaletteAxisConsistency reads each mood color's
  # warm/cool value from its hue (a code formula), multiplies it against the mood's stored
  # valence (emotion.mood_valence), and warns when the contradiction — a cool color on a
  # positive-valence mood, or a warm color on a negative one — exceeds this. Warn-only, never
  # a hard block. Tuned so every shipped registry palette passes with margin (the default's
  # sharpest contradiction sits at ~0.4) while a genuinely inverted palette still trips.
  axis_warn_valence_threshold: 0.6
  # Size of the aggregate candidate pool the stats query returns for one mood. The query accepts
  # this generated limit instead of owning a SQL literal. It runs ahead of popular_preset_count
  # because the pool serves two readers at once: the ranked popular presets, and the authored
  # preset looking up its own bucket's share. The authored color is usually near the top of the
  # ranking, so a couple of spare candidates cover both without a second round trip.
  recommendation_count: 5
  # How many ranked "other people chose this" presets one mood offers, beside the authored preset
  # and the random one.
  popular_preset_count: 3
  # Equal-width hue sectors on the OkLCH circle. Twelve 30-degree buckets cover chromatic colors.
  hue_bucket_degrees: 30
  # Colors at or below this OkLCH chroma enter the thirteenth, near-neutral bucket.
  near_neutral_chroma_max: 0.04
  # Warn when two mood colors are this close in OkLab. This remains below the authored default
  # table's minimum pairwise separation (0.0545), so the shipped defaults do not self-warn.
  similar_delta_e_min: 0.05
  # Live risk bands for a color the user is choosing, read as sRGB relative luminance. Server-side
  # lightness snapping already pins every mood color to one of three OkLCH steps, so these bands are
  # narrow by construction — they catch the ends of what snapping still lets through, not a wide
  # swathe of the picker.
  #
  # Above this the color is the brightest thing in the frame: the scene bloom pass (threshold 0.4)
  # picks it up hardest, and a star wearing it washes the neighbourhood it sits in. Only the top
  # lightness step reaches here at all, and only on the yellow-green arc — the shipped default that
  # comes closest is RELIEF at 0.537.
  glare_luminance_max: 0.55
  # Below this the color stops separating from the night sky it is drawn against. Only the deepest
  # lightness step reaches here, on the violet-magenta arc; the shipped default that comes closest is
  # ANGER at 0.2215.
  dim_luminance_min: 0.21
  # World radius for the thirteen-star onboarding field. It stays inside the portrait camera's
  # narrow axis so every selectable mood remains on-screen on mobile.
  onboarding_field_radius: 18

encode:
  # Event-boundary split bounds per diary — the TARGET the prompt asks for and the range the
  # extractor is re-prompted toward. Never clamped: an out-of-range result is re-prompted.
  min_memories: 2
  max_memories: 5
  # The floor the domain actually enforces, below the target. PRD [E2] reads "장면 단위, 보통 2~5개":
  # a day that held one continuous event is one scene, and the prompt's own event-boundary rule
  # forbids inventing a second one for it — so a one-memory split is an accepted outcome, not an
  # error. Only the target is negotiated with the model; this is what Encode and PersistEncoded admit.
  min_memories_accepted: 1
  # How many times a below-target count is re-prompted before it is accepted as the writer's day.
  # One: a single nudge distinguishes a lazy split from a genuinely single-scene diary, and a second
  # ask of a model that already declined once only burns the repair budget the other invariants need.
  under_count_nudges: 1
  # Extraction guideline enforced as retry/repair — a placeholder neuron is never injected.
  min_semantic_neurons: 1
  # Repair/revise re-prompts allowed per SplitDiary/ReviseSplit call after the initial extraction:
  # one user instruction plus up to two schema/count repairs before the canonical error.
  max_revise_retries: 3
  # Output budget the use-case enforces on the returned split (estimated tokens);
  # kept below ai.per_call_token_cap so the encode guard trips before the generic guard.
  # The split carries each memory's source_text, so the response holds the diary
  # redistributed across the memories — the budget is sized for the diary itself, not for
  # a handful of names. Korean runes count one token each in the estimate, so this admits
  # roughly a 5000-character entry plus the JSON structure around it.
  max_output_tokens: 6000
  # Fraction of the diary's tokens the source_texts must jointly account for. Below 1.0
  # because sentence-boundary repair legitimately drops connective fragments; high enough
  # that a split silently discarding a scene is a repair condition ([E1] partitions the
  # diary, it does not sample it).
  source_text_min_coverage: 0.9
  # Fraction of one source_text's tokens allowed to differ from the diary verbatim. This is
  # the repair budget — typo fixes plus the ending fixed at a cut edge. A passage needs one
  # or two; a model paraphrasing under the guise of repair needs far more. Applied as
  # max(1, ceil(ratio x tokens)) so a short passage still gets its one cut-edge repair.
  source_text_max_repaired_ratio: 0.1
  # Edit distance within which a non-verbatim token still counts as a repair of a diary
  # token rather than a substitution for it. Sized for the longest legitimate ending change
  # at a cut edge ("먹었는데" -> "먹었다" is 3); a typo is 1. A substituted word is caught by
  # the shared-first-character rule regardless of distance, so this can afford the headroom.
  source_text_max_repair_edit_distance: 3
  # Embedding-assist dedup: minimum cosine similarity for a neuron to surface as a
  # canonicalization candidate. Conservative — only near-identical wordings qualify,
  # keeping the merge bias toward "true synonyms only".
  dedup_similarity_threshold: 0.85
  # Embedding-assist dedup: nearest-neighbour candidates fetched per split. Small on
  # purpose — the assist is narrow; the LLM sees few, high-confidence candidates.
  dedup_top_k: 8
  # Name-in-body dedup candidates fetched per split, longest (most specific) names
  # first. Bounds the extractor prompt against users with many short neuron names.
  dedup_body_match_limit: 32
  # Co-membership weight written per neuron activation at launch. Uniform in Epic A;
  # differentiated weighting is a later-epic refinement behind the same NOT NULL column.
  activation_weight: 1.0

synapse:
  # Saturating LTP gains this fraction of the remaining headroom per co-firing.
  potentiation_rate: 0.2
  # One cap for every synapse signal kind; signal differences live in initials.
  strength_cap: 1.0
  # Fresh links start low and tier by causal signal strength (same > shared > temporal, [L10]).
  initial_same_memory: 0.32
  # Reserved tiers: today's linking seeds no synapse from these — a shared neuron is the link via
  # membership (no edge) and temporal proximity is a bonus, not an initial. Kept for a later
  # cross-memory linker that mints distinct shared/temporal edges.
  initial_shared_neuron: 0.2
  initial_temporal: 0.08
  # Read-time effective strength fades slowly in universe-days without mutating the stored base.
  strength_decay_per_day: 0.015
  # Temporal-link knobs: a co-firing inside temporal_window_days earns temporal_bonus on top of the
  # base — consumed by Link at launch.
  temporal_window_days: 3
  temporal_bonus: 0.1

semantic:
  # [C6a] Universe-days per gist stage: the gist-timer rises one semantic_stage each time this many
  # (modulation-adjusted) universe-days pass since semanticize_timer_reset_at. The timer REUSES the
  # forgetting.*_slow_coefficient modulation (arousal + connection slow it) — one knob for both axes,
  # no second modulation key. SEMANTIC_MAX_STAGE is the derived count of pregenerated gist texts (code,
  # not a value), and the neocortex z-band is force_sim.neocortex_z_* (reused, not re-declared).
  gist_units_per_stage: 10

reconsolidation:
  # [R3][V3] Per-recall headroom fraction the EffectiveStrength recall term gains, saturating toward
  # synapse.strength_cap — a handful of recalls grows a star noticeably without ever reaching the cap.
  recall_strength_gain: 0.15
  # [R5] Signed neighbor forgetting nudge in universe-days, added to a neighbor's forgetting_offset_days
  # on recall (never to the recalled star itself, [F5]). neighbor_slow_days is NEGATIVE — one shared
  # semantic neuron co-recalls a weak link (spreading activation), slowing its forgetting.
  neighbor_slow_days: -2.0
  # [R5] POSITIVE delta for a neighbor sharing >= neighbor_speed_threshold semantic neurons: a strong
  # competitor is inhibited (retrieval-induced forgetting, Anderson 1994), speeding its forgetting.
  neighbor_speed_days: 3.0
  # [R5] Shared-semantic-neuron count at/above which the neighbor delta flips from slow (-) to speed (+).
  # Fixed by the PRD (1 vs >=2) but kept a value so the boundary is not hardcoded.
  neighbor_speed_threshold: 2

consolidation:
  # [C4] Per-sleep global homeostatic scale-down (SHY) applied to every synapse's stored base
  # strength on a clock advance. Gentle on purpose: the universe sleeps on every launch/recall,
  # so the renormalization compounds across sleeps. Its own group — folding into synapse.* would
  # blur the SHY-vs-LTD ownership [I9].
  downscale_factor: 0.05
  # [C4][I1] The positive residual floor Downscale never drops a synapse below — a weak edge dims
  # toward silence but is never removed. Downscale also never weakens an edge already at/below it.
  downscale_floor: 0.05
  # [C4] Weak-edge bias exponent: how sharply the renormalization spares strong edges (keep signal,
  # prune noise). Higher = strong edges lose even less of the per-sleep factor.
  downscale_weak_bias: 2.0
  # [C2] Replay-set expansion bound: how many shared-neuron hops the touched constellation grows
  # from a stage-advanced memory. Bounds the companion re-layout so a long interval never
  # reorganizes the whole universe.
  replay_neighbor_hops: 1

forgetting:
  # Read-time brightness fade coefficient (per universe-day) driving EffectiveBrightness down its
  # exponential toward the floor — the Ebbinghaus curve made visible [F1][V2].
  brightness_decay_per_day: 0.02
  # The silent-engram floor EffectiveBrightness never drops below (never 0): a star dims, it is
  # never deleted [F2][I1]. Aligned with rendering.star_brightness_min — that render floor is the
  # visual image of this domain value.
  brightness_floor: 0.15
  # Universe-days per decay stage (the step spacing DecayStage crosses, stretched by the slow
  # factor) [F1].
  stage_interval_days: 30
  # Per-stage fraction of removable words redacted, strictly increasing; the ARRAY LENGTH derives
  # the number of decay stages (maxStage) — there is no separate declared count [F1][F9]. Applies to
  # stages 1..N; stage 0 is the vivid, unredacted text. The exact ratios are a v1 "to refine" [F9].
  stage_word_removal_ratios: [0.2, 0.4, 0.6, 0.85]
  # How strongly arousal stretches the decay time-axis — high-arousal memories dim/decay slower
  # (McGaugh consolidation); arousal is the only emotion input, valence never enters [F6][I3].
  arousal_slow_coefficient: 1.0
  # How strongly EffectiveStrength (connection/size) stretches the decay time-axis — better-connected
  # memories forget slower [F7].
  connection_slow_coefficient: 1.0
  # [F4][G1] Accessibility cost WEIGHT (a multiplier, not a Twinkle price — Epic F prices it, CC3):
  # deeper forgetting makes an episodic recall harder to pull back. Floor = the fully-accessible
  # baseline a freshly-recalled recall costs (never free [G1]); cap = a maximally decayed silent-engram
  # recall, expensive but bounded (never unreachable [I1][F2]).
  cost_weight_floor: 1.0
  cost_weight_cap: 4.0
  # Convex curvature of the floor->cap ease; > 1 keeps early decay cheap and steepens toward the floor
  # of silence [F4]. The curve formula + the [floor, cap] clamp stay code.
  cost_weight_curve: 2.0

twinkle:
  # [G2][U7] The daily SMALL Twinkle grant: refills to this amount at the start of the user's own
  # local calendar day (User.Timezone) and never carries unspent remainder into the next day.
  # Sized so a day of ordinary recall (a handful of 회고 + gist views) fits inside it — SMALL must
  # not block the core loop [G5].
  small_daily_amount: 100
  # [G4][F4] 회고 (recall) price floor term: the base Twinkle a recall costs before the
  # decay-depth term is added. The accessibility weight (forgetting.cost_weight_*) starts at
  # 1.0, so the cheapest real recall is base + coefficient.
  recall_base_cost: 5
  # [G4][F4] How steeply recall price rises per unit of accessibility/decay-depth weight —
  # deeper-forgotten memories cost more to pull back.
  recall_depth_coefficient: 10
  # [G4][G5] Cap on a single 회고 price so a maximally-decayed silent engram stays recallable
  # within a plausible daily balance (bounded, never unreachable).
  recall_max_cost: 40
  # [G4][R8] 요지 별 열람 (gist view) price at the shallowest gist stage (stage 1).
  gist_base_cost: 10
  # [G4][R8] Twinkle discount per deeper gist stage — deeper abstraction is cheaper to skim.
  gist_stage_discount: 3
  # [G4][G1] Floor for gist-view price: cheap but never free (the free surface is meta info
  # and the forgotten current text, not a gist read).
  gist_min_cost: 3
  # [G3] Twinkle granted per launched diary (the write earn path) — once per diary, not per
  # star, credited to GENERAL; a past-dated diary that launches no star earns nothing.
  earn_write: 100
  # [G3] Twinkle granted to the inviter on a valid signup (the invite earn path). Split from
  # the invitee grant so an asymmetric inviter bonus stays expressible.
  earn_invite_inviter: 500
  # [G3] Twinkle granted to the newly-signed-up friend on a valid signup (the invite earn
  # path); credited exactly once per signup.
  earn_invite_invitee: 500
  # [U11][G3] One-time onboarding grant after the account launches its first star. Equal to
  # the invitee leg so arriving without an invite is still meaningfully funded, while the
  # launch cost floor and dedup key keep it from becoming a login/attendance reward.
  earn_signup_bonus: 500
  # [G6] Lifetime number of rewarded invite signups per inviter. Ten rewards let genuine
  # sharing remain useful while bounding the inviter-side farming exposure at 5,000 Twinkle;
  # later links still bind, but no longer pay either invite leg once this cap is reached.
  invite_reward_max_per_inviter: 10
  # [G7][U9] GetLedger page size — the default AND the hard cap, so a client cannot ask for an
  # unbounded slice of its own history. Matches the admin user list's page size: the same "one
  # comfortable screenful, keyset-paged" judgment, and the ledger row is smaller.
  ledger_page_size: 50
  # Cap on a single admin stardust grant (별가루 증정), credited to GENERAL. A fat-finger
  # guard on the admin console's grant control — a larger gift is split across grants, each
  # audited. Provider identity/keys stay env/DB secrets, never values (plan 28).
  admin_grant_max: 100000

# Universe decoration (plan 71): what an ornament costs, priced BY KIND — there is no per-row
# price anywhere, so a single number moves a whole kind. Ornament ids, the catalog's rows and
# their acquisition paths are content and live as a Go table in the store context; the shader and
# sky constants a row resolves to are the renderer's visual grammar. Only these scalars are
# tuning.
#
# The five prices are graded by WHAT A ROW TOUCHES, not by how it was authored: a row that redraws
# the one body a memory is costs the most, a row that changes the whole sky costs the middle, and a
# row that changes only the decorative dust between them costs the least.
store:
  # [P9][G3] The GENERAL Twinkle price of any purchasable background. The entry price: three
  # launched diaries at twinkle.earn_write, so a few days of writing buys the first sky.
  background_price: 300
  # [P9][P11] The price of any purchasable star shape — dearer than a background because it
  # changes the star itself, the one body a memory is. Still inside a week of writing, so the
  # scarcer kind is a decision rather than a wall.
  star_shader_price: 600
  # [P9] The price of any purchasable gist body look. Under the star shape deliberately: a gist is
  # the summary a memory becomes, so it is the second body a writer meets and should not be the
  # dearer of the two.
  gist_shader_price: 500
  # [P9] The price of any purchasable mote — one particle's form and colour. The cheapest kind: a
  # mote is the smallest thing decoration can change, and it is the row a first-time decorator is
  # most likely to try, so it sits under a single day of writing.
  mote_price: 200
  # [P9] The price of any purchasable mote field — where the motes sit, how many, and how they
  # twinkle. Level with a background, because that is what it is the other half of: the two
  # together are the whole backdrop.
  mote_field_price: 300

# Achievements (plan 74): the reward a tier resolves to, and the one cross-context condition
# threshold. Catalog rows (ids, axes, targets, the axis→counter mapping, the two ornament
# capstones) are content and live as a Go table in the achievement context; the Achieved/Progress
# formulas are code. Only these scalars are tuning. `claim_toast_ms` and `unlock_notice_max`
# belong to this group too but are owned and written by plan 76.
achievement:
  # [A3][G3] GENERAL Twinkle paid by a tier-1 achievement — the firsts and the shallow tiers,
  # the most common reward. Half of twinkle.earn_write, so a first-experience reward reads as
  # meaningful without becoming a shortcut past writing.
  reward_tier_1: 50
  # [A3] The mid-tier reward: more than a diary's write earn, less than half an invite leg.
  reward_tier_2: 150
  # [A3][G3] The deep-tier reward — the largest stardust payout in the product outside an
  # invite/signup leg (which pay 500), so the deepest catalog rows stay below the social path.
  reward_tier_3: 400
  # [A2] Minimum PRE-recall decay stage (1..forgetting.stage_word_removal_ratios.length) for a
  # recall to count as a 망각·회복 event on `decay_recovered`. A value rather than catalog
  # content because plan 75 reads it at a memory call site, and values.yaml is the only
  # cross-context config channel (ARCHITECTURE §4). Stage 2 = the middle of the decay ladder:
  # visibly forgotten, not yet near-silent.
  recovery_decay_stage_min: 2
  # [A5] How long the unlock notice dwells. Longer than a glance, and deliberately SHORTER than
  # errors.toast_auto_dismiss_ms (6000): an error has to be read, an achievement only noticed —
  # the tab is where it is confirmed. The notice must not interrupt the universe.
  claim_toast_ms: 4000
  # [A5] Most unlock notices enqueued per read resolution; the rest are dropped rather than
  # queued. A diary that crosses several thresholds at once should read as one moment, not a
  # burst — and the tab already lists every one of them.
  unlock_notice_max: 2

# Admin console operational surface (plan 58): tuning for the web-only /admin console. Admin
# identity (ADMIN_USER_IDS), the config encryption key, and the Supabase service-role key are
# env secrets, not values.
admin:
  # Default page size for the admin user list and stardust-grant history pagination.
  user_list_page_size: 50
  # Idle time after the last operator keystroke before the account-prefix search is sent. The
  # directory scan can traverse multiple provider pages, so a half-typed query must never start it.
  search_debounce_ms: 300
  # The circuit breaker on one search's provider scan. GoTrue has no prefix filter, so a searched
  # page is reconstructed by walking raw provider pages, and a rare prefix walks the whole directory
  # — work that grows with the account count rather than with the query. This caps how many accounts
  # one search may walk; passing it refuses the request instead of issuing an unbounded request fan.
  # Sized well above the live directory, so tripping it is the signal that the local account
  # projection is now due, not a limit an operator is expected to meet.
  search_scan_max_accounts: 5000

force_sim:
  # Synapse spring coefficient; stronger synapses pull their neurons toward link_distance faster.
  charge: 0.035
  # Target rest length for neuron-to-neuron synapse springs in layout units. This is the universe's
  # scale knob: the cluster seed radii derive from it, and the rendered body sizes
  # (rendering.star_size_*, cell_star_point_size, gist_star_size_*) must stay well under the spacing
  # it produces, or big stars overlap their neighbours instead of hanging apart in space.
  link_distance: 20
  # Center pull coefficient; connectivity scales this so self-relevant nodes settle nearer the origin.
  # This — not link_distance — is what sets how tightly the whole universe balls up: the springs reach
  # their rest length long before the center force stops squeezing, so spacing is won here. Weakening
  # it stretches the cloud while keeping the relative gradient (a well-connected node still sits
  # nearer the origin than a lonely one).
  center_strength: 0.008
  # Barnes-Hut repulsion coefficient for baseline pattern separation — the local lever: it decides how
  # close the closest pair ends up, where center_strength decides the cloud's overall size.
  repulsion: 5
  # Per-tick alpha cooling, tuned for stable convergence without freezing the first launch.
  tick_alpha_decay: 0.022
  # Velocity retained per tick (1 = no damping); lower settles the layout faster but stiffer.
  velocity_damping: 0.62
  # Alpha floor so the layout keeps a little residual motion instead of freezing hard.
  min_alpha: 0.02
  hippocampus_z_min: 0
  hippocampus_z_max: 18
  neocortex_z_min: 27
  neocortex_z_max: 45
  seed: 190019

diary_reader:
  # [D2] GetDiaries pagination page size: diary entries fetched per page, keeping a long
  # reader-app archive lazy. The FE fetch reads this; the BE read may reuse the Go constant as
  # its default/clamp so a client cannot request an unbounded page.
  page_size: 20
  # A one-character substring cannot use a trigram index and would degrade to a full archive scan.
  search_min_query_length: 2
  # Calendar pages are written-day-grained; 31 keeps every civil month in one server-owned page.
  calendar_month_page_size: 31
  # [D12] How long a fetched month stays fresh. Shorter than client_cache.default_stale_ms, because the
  # marks are derived from live memory strength: letting go or releasing while the list view is showing
  # would otherwise leave a stale month painted when the calendar is toggled back on.
  calendar_stale_ms: 10000
  # [D12] Months prefetched either side of the displayed one, so prev/next does not flash a loading grid.
  # 1 covers a step in each direction — the only movement the view offers — and 0 disables prefetch.
  calendar_prefetch_months: 1
  # [D12] The weekday in the grid's first column (0 = Sunday … 6 = Saturday). One product-wide calendar
  # shape on both locales; deriving it from the active locale would make it a formula, not a value.
  calendar_week_start_day: 0
  # [D6] Code points of the immutable body a closed row previews before the ellipsis. The row has no
  # title, so the preview carries the recognition load; the length is the contract and CSS clamping /
  # numberOfLines is only a narrow-viewport guard.
  body_preview_length: 100
  # Distinct mood dots a row draws before collapsing the rest into "+N". One below encode.max_memories
  # so a diary that launched five differently-felt stars still reveals the marker rather than silently
  # dropping a mood.
  row_mood_dot_max: 4
  # [D7] How far below the viewport the web sentinel asks for the next keyset page — roughly half a
  # screen of prefetch, so the list grows before the reader reaches the bottom.
  infinite_scroll_root_margin_px: 400
  # [D6] The web list windows its rows, and these three drive that window. The height a CLOSED row is
  # assumed to have before it has been measured — one date line, ONE clamped preview line and the
  # star/mood footer, measured at 92px in a browser at the reader's max width. Every row carries the
  # same three single lines, so this is the height every row actually has rather than an average over
  # a ragged list; it stays an estimate only in that a mounted row still reports its own measurement.
  row_estimate_height_px: 92
  # Rows kept mounted beyond each edge of the viewport. Enough that an ordinary flick never exposes a
  # blank band, small enough that the mounted count stays a viewport's worth rather than an archive's.
  row_overscan: 4
  # Vertical space between two rows. The windowed list positions its rows absolutely, so the gap is a
  # number the virtualizer inserts rather than a flex `gap` class — this is its only source.
  row_gap_px: 8
  # [D6] The narrowest a web archive column may become before the grid drops a column. The list grows
  # its column count by dividing the measured width by this, so the archive gains columns as the
  # window widens instead of stepping at named breakpoints — a card holds a date, ONE clamped preview
  # line and the star/mood footer, and below this the preview stops being a preview.
  row_min_width_px: 288
  # The mobile FlatList onEndReachedThreshold: a ratio of visible length, not pixels, which is why it
  # cannot share the key above.
  infinite_scroll_end_threshold: 0.5
  # [D9] Idle time after the last keystroke before the keyword is committed and refetched. Above a fast
  # typist's inter-key gap, so one typed phrase costs one GetDiaries round trip.
  search_debounce_ms: 300

deletion:
  # [X1][X4] LTD step passed to Depress when a removed memory withdraws its contribution from a
  # SHARED (kept) neuron's synapse. An absolute strength decrement (Depress clamps to 0..strength_cap):
  # conservative so a delete visibly thins the shared bond without erasing it — the base is never
  # deleted and the neuron keeps its other, stronger bonds (fresh same-memory edges start ~0.32).
  contribution_weaken_amount: 0.15

release:
  # [X2] The full-delete restore window: a diary release is a soft-delete kept restorable for this
  # many real-clock (wall-clock UTC) days, after which the retention sweep hard-deletes it. The single
  # boundary of the "30 days to change your mind" promise — real-world time, not universe-time, so it
  # is independent of launches/recalls and account withdrawal. Letting-go is permanent and has NO
  # timer key (that absence is the [X5] guarantee).
  soft_delete_retention_days: 30

sequence:
  # [O2] How long a `dwell` step's caption holds before the run advances itself — reading time for one
  # unhurried line, not a pace the user has to keep up with. It is a tuning scalar rather than a
  # per-script number because both hosts (the public demo and the onboarding tour) read the same one:
  # a caption that reads comfortably in a trailer reads comfortably in a tour. A step that waits on
  # something the USER must do is a `signal` step and never consults this.
  caption_dwell_ms: 4500
  # [O2] One pulse period of the spotlight ring. Slow enough to read as breathing rather than
  # blinking, and ignored entirely under reduced motion (the ring goes static — the highlight is
  # decorative, so removing its motion removes nothing the run depends on).
  highlight_pulse_ms: 1800

demo:
  # [Z2][Z3]-5/7 Universe-days one "+1달" time-jump press advances the demo clock — the largest of the
  # demo's three time grains (the day and week jumps are the fixed calendar units 1 and 7, not tuning
  # numbers, so they claim no key). Sized as one legible calendar month, and large enough that a single
  # press already shows dimming and early word loss on the set's older memories (the decay stage
  # interval is 30 universe-days, stretched by the slow factor) and moves a gist stage (a gist unit is
  # 10 universe-days, similarly stretched) — the demo's whole job is compressing days into seconds.
  # There is deliberately NO monotonicity, cost or consent key beside this one: the demo clock is
  # exempt, and that exemption is expressible only here because no shared code knows the demo exists.
  time_travel_month_days: 30
  # How long the tutorial's covering mask stays lifted after a launch or a time sweep finishes, so
  # the scene the press just caused — a memory going up, the sky settling after a jump — plays in
  # the clear before the covering returns. Long enough for the awaken choreography to land, short
  # enough that the tour does not read as paused.
  mask_lift_linger_ms: 2400

landing:
  # How far the walkthrough's `fade` step pushes its clock, in universe-days. Tuned AGAINST other keys
  # in this file rather than picked: long enough that `forgetting.stage_interval_days` (30) is crossed
  # by every memory in the run once each one's slow factor has stretched the axis — the slowest here
  # needs about 2× the interval — and short enough that none of them reaches the deepest rung of
  # `forgetting.stage_word_removal_ratios`. Dim and eroded, never gone: the step has to show neglect
  # as loss the visitor would want to undo, and a memory read down to nothing has nothing to return.
  walkthrough_fade_span_days: 150
  # How many recalls the `mirror` step accumulates on the one returned-to memory. It is what tilts the
  # sky towards that memory's feeling ([M5]), because the sky weighs each memory by its
  # EffectiveStrength and `synapse.recall_*` growth is what a recall count buys. Enough passes that the
  # tilt is visible in one screenshot; few enough that the memory does not swamp the sky it is one
  # voice in.
  walkthrough_mirror_recalls: 5
