name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Pin the backend Go toolchain so the go-check gates (vet/build/test) run under a known
      # version, not the runner's ambient Go — matching apps/api/go.mod. go-check.mjs prefers a
      # host `go` when present, so this version is what the CI gate actually uses.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
